pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'digger-java'

// The Android app (:android) is only included when an Android SDK is available
// (local.properties sdk.dir, or ANDROID_HOME / ANDROID_SDK_ROOT), so the desktop
// build keeps working on machines without the SDK.
def localProps = new Properties()
def localFile = file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
def sdkDir = localProps.getProperty('sdk.dir') ?: System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
if (sdkDir != null && new File(sdkDir).isDirectory()) {
    include ':android'
}
